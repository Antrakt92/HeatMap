name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  known-good:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt -c constraints-known-good.txt
      - run: python tools/check_constraint_ages.py
      - run: python -m pip check
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q overlay.py setup.py tests
      - run: python tools/sync_runtime_manifest.py --check
      - run: python setup.py --verify
      - run: python setup.py --preflight

  clean-room-runtime-restore:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt -c constraints-known-good.txt
      - run: Remove-Item -LiteralPath lib -Recurse -Force
      - run: python setup.py --restore-runtime
      - run: python setup.py --verify
      - run: python setup.py --preflight

  third-party-license-provenance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python tools/check_third_party_licenses.py

  latest-compatible:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q overlay.py setup.py tests
      - run: python tools/sync_runtime_manifest.py --check
      - run: python setup.py --verify
      - run: python setup.py --preflight
