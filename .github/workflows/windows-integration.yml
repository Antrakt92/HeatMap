name: Windows integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduler-and-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.txt -c constraints-known-good.txt
      - name: Register, export, classify, and delete disposable task
        shell: pwsh
        run: ./tools/test_task_scheduler_integration.ps1
      - name: Exercise launcher without UAC
        shell: pwsh
        run: ./tools/test_launcher_integration.ps1
